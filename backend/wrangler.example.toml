# Example only. Copy to wrangler.toml, supply actual configuration, and review before deployment.
name = "winter-camp-interest"
main = "worker.mjs"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

[vars]
ALLOWED_ORIGIN = "https://your-site.example.invalid"

[[d1_databases]]
binding = "DB"
database_name = "winter-camp-parent-interest"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[[ratelimits]]
name = "INTEREST_RATE_LIMITER"
# Choose an unused positive integer namespace in your own Cloudflare account.
namespace_id = "1001"
[ratelimits.simple]
limit = 10
period = 60

[observability]
enabled = false

# Bind a reviewed HTTPS custom domain/route in your own account before use.
# Do not place secrets in this file or in the public frontend.
# Required secrets: TURNSTILE_SECRET, RATE_LIMIT_SALT, ADMIN_TOKEN
